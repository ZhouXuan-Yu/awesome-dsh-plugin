url: https://github.com/ZhouXuan-Yu/dsh-model-rotation
name: ZhouXuan-Yu/dsh-model-rotation
category: model
description:
  en: 'Model rotation for DeepSeek Harness: groups each provider''s models by source, orders them by hand or by measured success rate and latency, stores model plus reasoning-effort presets, falls over to the next entry when a model hits its quota or is unavailable, resends the same step on the next model, and shows which model actually answered.'
  zh: '按来源分组的模型轮询：把每个 provider 的模型按来源分组，可手动排序，也可按成功率和延迟自动排序；支持「模型 + 思考强度」预设；某一档额度用尽或不可用时自动切到下一档，并用下一档把同一步重新发一次；会话头显示本次回答由哪个模型产出。'
